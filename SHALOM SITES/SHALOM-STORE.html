<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHALOM GENERAL STORE</title>
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shalom Store">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316a34a'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --green-900: #14532d;
  --green-800: #166534;
  --green-700: #15803d;
  --green-600: #16a34a;
  --green-100: #dcfce7;
  --green-50: #f0fdf4;
  --grey-900: #111827;
  --grey-800: #1f2937;
  --grey-700: #374151;
  --grey-600: #4b5563;
  --grey-500: #6b7280;
  --grey-400: #9ca3af;
  --grey-300: #d1d5db;
  --grey-200: #e5e7eb;
  --grey-100: #f3f4f6;
  --grey-50: #f9fafb;
  --white: #ffffff;
  --red: #dc2626;
  --red-50: #fef2f2;
  --amber: #b45309;
  --amber-50: #fffbeb;
  --blue: #1d4ed8;
  --blue-50: #eff6ff;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(17,24,39,.06), 0 1px 3px rgba(17,24,39,.08);
  --shadow-lg: 0 20px 40px rgba(17,24,39,.18);
  --sidebar-w: 248px;
  /* theme-controlled (set by the Theme page) */
  --sb-bg: #111827;
  --sb-text: #d1d5db;
  --sb-strong: #ffffff;
  --sb-muted: #9ca3af;
  --sb-hover: rgba(255,255,255,.07);
  --sb-border: rgba(255,255,255,.07);
  --ink: #111827;            /* dark surfaces: cart totals, toasts */
  --red-soft: #fee2e2; --red-line: #fecaca; --red-ink: #991b1b;
  --amber-soft: #fef3c7; --amber-line: #fde68a; --amber-ink: #92400e;
  --blue-soft: #dbeafe; --blue-line: #bfdbfe; --blue-ink: #1e40af;
  --green-line: #bbf7d0;
  --base-font: 14px;
  color-scheme: light;
}
html[data-mode="dark"] {
  --white: #182130;
  --grey-50: #1e2939;
  --grey-100: #0e1520;
  --grey-200: #2a3546;
  --grey-300: #3a4658;
  --grey-400: #7c8798;
  --grey-500: #9aa5b4;
  --grey-600: #b3bcc8;
  --grey-700: #cdd3dc;
  --grey-800: #e5e7eb;
  --grey-900: #f5f6f8;
  --ink: #05090f;
  --red-50: rgba(239,68,68,.12); --red-soft: rgba(239,68,68,.2); --red-line: rgba(239,68,68,.4); --red-ink: #fca5a5;
  --amber-50: rgba(245,158,11,.12); --amber-soft: rgba(245,158,11,.2); --amber-line: rgba(245,158,11,.4); --amber-ink: #fcd34d;
  --blue-50: rgba(59,130,246,.12); --blue-soft: rgba(59,130,246,.2); --blue-line: rgba(59,130,246,.4); --blue-ink: #93c5fd;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--grey-100);
  color: var(--grey-800);
  font-size: var(--base-font);
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--green-700); }
h1, h2, h3, h4 { margin: 0; color: var(--grey-900); }
.hidden { display: none !important; }
.muted { color: var(--grey-500); }
.small { font-size: 12px; }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.mono { font-variant-numeric: tabular-nums; }
.text-red { color: var(--red); }
.text-green { color: var(--green-700); }
.text-amber { color: var(--amber); }

/* ---------- Boot / login ---------- */
.boot-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--grey-600); }
.spinner { width: 38px; height: 38px; border: 4px solid var(--green-100); border-top-color: var(--green-600); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.auth-wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.auth-brand { background: linear-gradient(150deg, var(--green-900), var(--green-700) 60%, var(--green-600)); color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; }
.auth-brand h1 { color: #fff; font-size: 38px; line-height: 1.1; letter-spacing: .5px; }
.auth-brand p { opacity: .88; max-width: 440px; font-size: 15px; }
.auth-brand ul { padding-left: 18px; opacity: .9; }
.auth-brand li { margin: 6px 0; }
.auth-panel { display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--white); }
.auth-card { width: 100%; max-width: 380px; }
.auth-card h2 { font-size: 24px; margin-bottom: 6px; }
.auth-card .muted { margin-bottom: 22px; }
.logo-mark { width: 52px; height: 52px; border-radius: 14px; background: #fff; color: var(--green-700); display: grid; place-items: center; font-weight: 800; font-size: 26px; }
.demo-banner { background: var(--amber-50); border: 1px solid #fcd34d; color: #78350f; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; margin-bottom: 16px; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); background: var(--sb-bg); color: var(--sb-text); position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; z-index: 40; transition: transform .2s ease; }
.sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 16px; border-bottom: 1px solid var(--sb-border); }
.sidebar .brand .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--green-600); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 18px; flex: none; }
.sidebar .brand b { color: var(--sb-strong); font-size: 13.5px; letter-spacing: .4px; display: block; line-height: 1.2; }
.sidebar .brand small { color: var(--sb-muted); font-size: 11px; }
.nav { flex: 1; overflow-y: auto; padding: 10px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 9px; color: var(--sb-text); text-decoration: none; font-weight: 500; margin-bottom: 2px; position: relative; }
.nav a:hover { background: var(--sb-hover); color: var(--sb-strong); }
.nav a.active { background: var(--green-700); color: #fff; }
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav .badge { margin-left: auto; }
.nav .sep { height: 1px; background: var(--sb-border); margin: 8px 4px; }
.sidebar .me { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--sb-border); }
.sidebar .me .name { color: var(--sb-strong); font-weight: 600; font-size: 13px; }
.sidebar .me .role { font-size: 11px; color: var(--sb-muted); text-transform: uppercase; letter-spacing: .6px; }
.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; background: var(--white); border-bottom: 1px solid var(--grey-200); display: flex; align-items: center; gap: 12px; padding: 12px 24px; }
.topbar h1 { font-size: 19px; flex: 1; }
.topbar .date { color: var(--grey-500); font-size: 13px; }
.icon-btn { background: none; border: 1px solid var(--grey-200); border-radius: 9px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; position: relative; color: var(--grey-700); }
.icon-btn:hover { background: var(--grey-50); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn .dot { position: absolute; top: -5px; right: -5px; }
.menu-btn { display: none; }
.content { padding: 22px 24px 40px; flex: 1; }
.mode-strip { background: var(--amber-50); color: #78350f; border-bottom: 1px solid #fde68a; padding: 7px 24px; font-size: 12.5px; }
.overlay { display: none; }

/* ---------- Avatars ---------- */
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green-700); color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; overflow: hidden; object-fit: cover; }
.avatar.sm { width: 26px; height: 26px; font-size: 11px; }
.avatar.lg { width: 84px; height: 84px; font-size: 30px; }
img.avatar { display: inline-block; }
.who { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- Cards ---------- */
.grid { display: grid; gap: 16px; }
.stats { grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); margin-bottom: 18px; }
.stat { background: var(--white); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--grey-200); position: relative; overflow: hidden; }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--green-600); }
.stat.grey::before { background: var(--grey-600); }
.stat.red::before { background: var(--red); }
.stat.amber::before { background: #f59e0b; }
.stat .label { color: var(--grey-500); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.stat .value { font-size: 23px; font-weight: 700; color: var(--grey-900); margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat .sub { color: var(--grey-500); font-size: 12px; margin-top: 2px; }
.card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--grey-200); margin-bottom: 18px; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--grey-200); }
.card-h h3 { font-size: 15px; flex: 1; }
.card-b { padding: 16px 18px; }
.card-b.flush { padding: 0; }
.two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; }
.two-col.even { grid-template-columns: 1fr 1fr; }
.chart-box { position: relative; height: 260px; }

/* ---------- Buttons & forms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: 9px; padding: 8px 14px; font-weight: 600; cursor: pointer; background: var(--green-600); color: #fff; text-decoration: none; white-space: nowrap; font-size: 13.5px; }
.btn:hover { background: var(--green-700); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn.secondary { background: var(--white); color: var(--grey-800); border-color: var(--grey-300); }
.btn.secondary:hover { background: var(--grey-50); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.dark:hover { background: var(--ink); filter: brightness(1.3); }
.btn.danger { background: var(--red); }
.btn.danger:hover { background: #b91c1c; }
.btn.ghost { background: transparent; color: var(--grey-700); }
.btn.ghost:hover { background: var(--grey-100); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.lg { padding: 12px 18px; font-size: 15px; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--grey-700); }
.field .hint { font-size: 11.5px; color: var(--grey-500); }
.input, select.input, textarea.input { width: 100%; padding: 9px 11px; border: 1px solid var(--grey-300); border-radius: 9px; background: var(--white); outline: none; }
.input:focus { border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
textarea.input { resize: vertical; min-height: 70px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-grid .full { grid-column: 1 / -1; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .input { width: auto; min-width: 140px; }
.toolbar .search { flex: 1; min-width: 200px; }
.seg { display: inline-flex; border: 1px solid var(--grey-300); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--white); padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--grey-600); border-right: 1px solid var(--grey-200); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--green-700); color: #fff; }
.error-text { color: var(--red); font-size: 12.5px; margin: 4px 0 10px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--grey-500); font-weight: 700; background: var(--grey-50); padding: 10px 12px; border-bottom: 1px solid var(--grey-200); white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--grey-100); vertical-align: middle; }
table.t tr:hover td { background: var(--green-50); }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tfoot td { font-weight: 700; background: var(--grey-50); border-top: 2px solid var(--grey-200); }
tr.row-reversed td { color: var(--grey-400); text-decoration: line-through; }
tr.row-reversed td .badge, tr.row-reversed td .btn { text-decoration: none; }
tr.row-overdue td { background: var(--red-50); }
.empty { padding: 34px 18px; text-align: center; color: var(--grey-500); }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.b-green { background: var(--green-100); color: var(--green-ink, var(--green-800)); }
.b-red { background: var(--red-soft); color: var(--red-ink); }
.b-amber { background: var(--amber-soft); color: var(--amber-ink); }
.b-grey { background: var(--grey-200); color: var(--grey-700); }
.b-blue { background: var(--blue-soft); color: var(--blue-ink); }
.count-badge { background: var(--red); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700; line-height: 18px; min-width: 18px; text-align: center; display: inline-block; }

/* ---------- Alerts ---------- */
.alert { border-radius: 10px; padding: 11px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.alert.red { background: var(--red-50); border: 1px solid var(--red-line); color: var(--red-ink); }
.alert.amber { background: var(--amber-50); border: 1px solid var(--amber-line); color: var(--amber-ink); }
.alert.green { background: var(--green-50); border: 1px solid var(--green-line); color: var(--green-ink, var(--green-900)); }
.alert.blue { background: var(--blue-50); border: 1px solid var(--blue-line); color: var(--blue-ink); }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--grey-100); }
.list-plain li:last-child { border-bottom: 0; }

/* ---------- POS ---------- */
.pos { display: grid; grid-template-columns: 1fr 400px; gap: 18px; align-items: start; }
.pos-results { max-height: 470px; overflow-y: auto; }
.pos-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--grey-100); cursor: pointer; }
.pos-item:hover { background: var(--green-50); }
.pos-item.disabled { opacity: .5; cursor: not-allowed; }
.pos-item .nm { font-weight: 600; color: var(--grey-900); }
.pos-item .price { margin-left: auto; text-align: right; font-weight: 700; color: var(--green-800); }
.cart-line { display: grid; grid-template-columns: 1fr 76px 92px 26px; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--grey-200); }
.cart-line .nm { font-weight: 600; }
.cart-line input { padding: 6px 8px; text-align: center; }
.cart-line .x { background: none; border: 0; color: var(--red); cursor: pointer; font-size: 18px; line-height: 1; }
.cart-line2 { padding: 10px 0; border-bottom: 1px dashed var(--grey-200); display: grid; gap: 7px; }
.cart-line2 .cl-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.cart-line2 .nm { font-weight: 600; }
.cart-line2 .cl-row { display: grid; grid-template-columns: minmax(0, 1.4fr) 90px 92px; gap: 8px; align-items: center; }
.cart-line2 .cl-row .input { padding: 7px 8px; }
.cart-line2 .x { background: none; border: 0; color: var(--red); cursor: pointer; font-size: 20px; line-height: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--grey-300); background: var(--white); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--grey-700); }
.chip:hover { border-color: var(--green-600); }
.chip.on { background: var(--green-600); border-color: var(--green-600); color: #fff; }
.pos-item .price .btn { margin-top: 4px; }
.totals {background: var(--ink); color: #fff; border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
.totals .row { display: flex; justify-content: space-between; padding: 3px 0; }
.totals .big { font-size: 24px; font-weight: 800; }
.pay-status { border-radius: 10px; padding: 10px 12px; font-weight: 600; margin-bottom: 12px; }
.pay-status.ok { background: var(--green-50); color: var(--green-ink, var(--green-800)); border: 1px solid var(--green-line); }
.pay-status.debt { background: var(--red-50); color: var(--red-ink); border: 1px solid var(--red-line); }
.debtor-box { border: 2px solid var(--red-line); background: var(--red-50); border-radius: 12px; padding: 12px 12px 0; margin-bottom: 12px; }
.debtor-box h4 { color: var(--red-ink); font-size: 13.5px; margin-bottom: 8px; }

/* ---------- Modals & toasts ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(17,24,39,.55); display: flex; align-items: flex-start; justify-content: center; padding: 40px 14px; z-index: 100; overflow-y: auto; }
.modal { background: var(--white); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: var(--shadow-lg); animation: pop .15s ease; }
.modal.wide { max-width: 860px; }
.modal.narrow { max-width: 420px; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--grey-200); }
.modal-h h3 { flex: 1; font-size: 16px; }
.modal-h .close { background: none; border: 0; font-size: 24px; line-height: 1; cursor: pointer; color: var(--grey-500); }
.modal-b { padding: 18px 20px; }
.modal-f { padding: 14px 20px; border-top: 1px solid var(--grey-200); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.modal.alerting .modal-h { background: var(--red-50); border-radius: 14px 14px 0 0; }
.modal.msg-pop .modal-h { background: var(--green-50); border-radius: 14px 14px 0 0; }
#toastRoot { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); max-width: 360px; font-size: 13.5px; animation: pop .15s ease; border-left: 4px solid var(--green-600); }
.toast.error { border-left-color: var(--red); }
.toast.warn { border-left-color: #f59e0b; }

/* ---------- Messages ---------- */
.msg-layout { display: grid; grid-template-columns: 320px 1fr; min-height: 520px; }
.thread-list { border-right: 1px solid var(--grey-200); overflow-y: auto; max-height: 640px; }
.thread-item { padding: 12px 16px; border-bottom: 1px solid var(--grey-100); cursor: pointer; display: flex; gap: 10px; }
.thread-item:hover { background: var(--grey-50); }
.thread-item.on { background: var(--green-50); }
.thread-item .snip { color: var(--grey-500); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.thread-item.unread .tt { font-weight: 800; }
.thread-view { display: flex; flex-direction: column; }
.bubbles { flex: 1; padding: 16px; overflow-y: auto; max-height: 520px; display: flex; flex-direction: column; gap: 10px; background: var(--grey-50); }
.bubble { max-width: 78%; display: flex; gap: 8px; align-items: flex-end; }
.bubble .body { background: var(--white); border: 1px solid var(--grey-200); padding: 9px 12px; border-radius: 12px 12px 12px 3px; white-space: pre-wrap; word-wrap: break-word; }
.bubble.mine { align-self: flex-end; flex-direction: row-reverse; }
.bubble.mine .body { background: var(--green-700); color: #fff; border-color: var(--green-700); border-radius: 12px 12px 3px 12px; }
.bubble .meta { font-size: 11px; color: var(--grey-500); margin-top: 3px; }
.bubble.mine .meta { text-align: right; }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--grey-200); }
.composer textarea { min-height: 44px; flex: 1; }

/* ---------- Receipt ---------- */
.receipt { font-family: "Courier New", Courier, monospace; color: #000; background: #fff; width: 100%; max-width: 330px; margin: 0 auto; font-size: 12.5px; line-height: 1.35; }
.receipt.a4 { max-width: 560px; font-size: 13.5px; }
.receipt .rc-center { text-align: center; }

<body>
  <div id="root">
    <div class="boot-screen"><div class="spinner"></div><p>Loading SHALOM GENERAL STORE…</p></div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <div id="printArea"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script>
/*
 * SHALOM GENERAL STORE - online database connection
 * --------------------------------------------------
 * Leave this as null to run in DEMO mode (data is saved only in this browser).
 *
 * To go LIVE with an online database shared by all sellers, paste your
 * Firebase web-app config here (see README.md, step 1), e.g.:
 *
 * window.SHALOM_FIREBASE_CONFIG = {
 *   apiKey: "AIza....",
 *   authDomain: "shalom-store.firebaseapp.com",
 *   projectId: "shalom-store",
 *   storageBucket: "shalom-store.appspot.com",
 *   messagingSenderId: "1234567890",
 *   appId: "1:1234567890:web:abc123"
 * };
 *
 * These values are not secret - access is protected by firestore.rules.
 */
window.SHALOM_FIREBASE_CONFIG = null;

</script>
  <script>
/*
 * SHALOM GENERAL STORE - core data layer
 * Two interchangeable backends with the same interface:
 *   - FirebaseBackend : online Firestore database + Firebase Authentication (LIVE mode)
 *   - LocalBackend    : browser localStorage (DEMO mode / automated tests)
 * All business rules (stock deduction, profit, debts, reversals) live in Logic and run
 * inside database transactions, so stock can never go negative or be deducted twice.
 */
(function (global) {
  'use strict';

  const EMAIL_DOMAIN = 'shalom-store.app';
  const FIREBASE_VER = '10.12.2';

  // ---------------------------------------------------------------- helpers
  const pad = (n, l) => String(n).padStart(l, '0');
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const r3 = (n) => Math.round((Number(n) || 0) * 1000) / 1000;

  // ---------------------------------------------------------------- units of measurement
  // dec: can be sold in fractions (0.5 kg). sub: smaller unit the seller may type in (grams, ml, cm).
  const UNITS = {
    pcs: { name: 'Pieces (pcs)' }, kg: { name: 'Kilograms (kg)', dec: true, sub: ['g', 1000] }, g: { name: 'Grams (g)', dec: true },
    ltr: { name: 'Litres (ltr)', dec: true, sub: ['ml', 1000] }, ml: { name: 'Millilitres (ml)', dec: true }, m: { name: 'Metres (m)', dec: true, sub: ['cm', 100] },
    packet: { name: 'Packets' }, bottle: { name: 'Bottles' }, tin: { name: 'Tins' }, sachet: { name: 'Sachets' }, bar: { name: 'Bars' },
    bag: { name: 'Bags' }, box: { name: 'Boxes' }, carton: { name: 'Cartons' }, bale: { name: 'Bales' }, bundle: { name: 'Bundles' },
    roll: { name: 'Rolls' }, pair: { name: 'Pairs' }, dozen: { name: 'Dozens' }, tray: { name: 'Trays' }, crate: { name: 'Crates' },
    set: { name: 'Sets' }, tablet: { name: 'Tablets' }, piece: { name: 'Piece (single)' },
  };
  const PACK_NAMES = ['bale', 'carton', 'sack', 'box', 'crate', 'dozen', 'bundle', 'tray', 'pack', 'roll', 'bag', 'jerrican'];
  const unitInfo = (p) => UNITS[(p && p.unit) || 'pcs'] || { name: p.unit, dec: false };
  const isDec = (p) => !!unitInfo(p).dec;
  const hasPack = (p) => !!(p && p.packName && Number(p.packSize) > 0);
  const packPrice = (p) => (hasPack(p) ? r2(p.packPrice > 0 ? p.packPrice : p.packSize * p.sellPrice) : 0);
  function fmtQ(n) { const v = r3(n); return Number.isInteger(v) ? String(v) : String(v).replace(/(\.\d*?)0+$/, '$1'); }
  const plural = (w, n) => (Number(n) === 1 ? w : w + 's');
  /** "162 pcs (3 bales + 12 pcs)" */
  function stockText(p, qty) {
    const q = r3(qty == null ? p.qty : qty);
    const u = (p && p.unit) || 'pcs';
    let t = fmtQ(q) + ' ' + u;
    if (hasPack(p) && q > 0) {
      const packs = Math.floor(q / p.packSize + 1e-9);
      const rest = r3(q - packs * p.packSize);
      if (packs > 0) t += ' (' + packs + ' ' + plural(p.packName, packs) + (rest > 0 ? ' + ' + fmtQ(rest) + ' ' + u : '') + ')';
    }
    return t;
  }
  /**
   * Turn what the seller typed into an exact sale line.
   * mode: 'unit' (e.g. 2 kg / 3 pcs) | 'sub' (e.g. 500 g of a kg product) | 'pack' (e.g. 1 bale) | 'amount' (e.g. KSh 50 worth)
   */
  function resolveLine(p, mode, value) {
    const u = unitInfo(p);
    const unit = p.unit || 'pcs';
    const v = Number(value);
    if (value === '' || value == null || !isFinite(v) || v <= 0) throw new Error('Enter a quantity for "' + p.name + '".');
    let qty, subtotal, qtyText, rate, rateUnit;
    if (mode === 'sub') {
      if (!u.sub) throw new Error('"' + p.name + '" cannot be sold in smaller units.');
      qty = v / u.sub[1]; subtotal = r2(qty * p.sellPrice); qtyText = fmtQ(v) + ' ' + u.sub[0]; rate = p.sellPrice; rateUnit = unit;
    } else if (mode === 'pack') {
      if (!hasPack(p)) throw new Error('"' + p.name + '" is not sold in packs.');
      if (!Number.isInteger(v)) throw new Error('Enter whole ' + plural(p.packName, 2) + ' for "' + p.name + '".');
      qty = v * p.packSize; subtotal = r2(v * packPrice(p)); qtyText = v + ' ' + plural(p.packName, v) + ' (' + fmtQ(qty) + ' ' + unit + ')'; rate = packPrice(p); rateUnit = p.packName;
    } else if (mode === 'amount') {
      if (!u.dec) throw new Error('Selling by money amount works only for measured items (kg, litres, metres).');
      if (!(p.sellPrice > 0)) throw new Error('"' + p.name + '" has no selling price.');
      qty = v / p.sellPrice; subtotal = r2(v); qtyText = fmtQ(qty) + ' ' + unit; rate = p.sellPrice; rateUnit = unit;
    } else {
      if (!u.dec && !Number.isInteger(v)) throw new Error('"' + p.name + '" is sold in whole ' + unit + ' - enter a whole number.');
      qty = v; subtotal = r2(v * p.sellPrice); qtyText = fmtQ(v) + ' ' + unit; rate = p.sellPrice; rateUnit = unit;
      mode = 'unit';
    }
    qty = r3(qty);
    if (qty <= 0) throw new Error('Quantity for "' + p.name + '" is too small.');
    return { mode, value: v, qty, subtotal, qtyText, rate: r2(rate), rateUnit };
  }
  const clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  function dayKey(ms) {
    const d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2);
  }
  function applyUpdate(doc, upd) {
    for (const [k, v] of Object.entries(upd)) {
      if (k.includes('.')) {
        const parts = k.split('.');
        let o = doc;
        for (let i = 0; i < parts.length - 1; i++) {
          if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {};
          o = o[parts[i]];
        }
        o[parts[parts.length - 1]] = v;
      } else doc[k] = v;
    }
    return doc;
  }
  async function hashPw(pw, salt) {
    const text = salt + '::' + pw;
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      let h = 5381;
      for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
      return 'x' + (h >>> 0).toString(16);
    }
  }
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = res;
      s.onerror = () => rej(new Error('Could not load ' + src + ' - check the internet connection.'));
      document.head.appendChild(s);
    });
  }
  function cleanUsername(u) {
    return String(u || '').trim().toLowerCase();
  }
  function validUsername(u) {
    return /^[a-z0-9._-]{3,30}$/.test(u);
  }

  const DEFAULT_SETTINGS = {
    shopName: 'SHALOM GENERAL STORE',
    address: '',
    phone: '',
    email: '',
    kraPin: '',
    currency: 'KSh',
    lowStockDefault: 5,
    debtAlertHours: 24,
    receiptPaper: '80mm',
    receiptFooter: 'THANK YOU FOR SHOPPING WITH SHALOM GENERAL STORE. KARIBU TENA!',
    categories: ['Foodstuffs', 'Beverages', 'Household', 'Toiletries', 'Stationery', 'Electronics', 'Hardware', 'Other'],
  };

  // ---------------------------------------------------------------- Local backend
  class LocalBackend {
    constructor(key) {
      this.mode = 'local';
      this.key = key || 'shalom_store_db_v1';
      this.sessionKey = this.key + '_session';
      this.listeners = [];
      this.queue = Promise.resolve();
      this.authCb = null;
      this.load();
    }
    load() {
      let d = null;
      try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) { d = null; }
      this.data = d && d.cols ? d : { cols: {}, auth: {} };
    }
    save() {
      try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {
        throw new Error('Browser storage is full or blocked. Export a backup in Settings.');
      }
    }
    async init() {
      window.addEventListener('storage', (e) => {
        if (e.key === this.key) { this.load(); this.listeners.forEach((l) => this.emit(l)); }
      });
    }
    col(c) { return this.data.cols[c] || (this.data.cols[c] = {}); }
    emit(l) {
      const all = Object.entries(this.col(l.col)).map(([id, d]) => Object.assign(clone(d), { id }));
      const docs = l.docId ? all.filter((d) => d.id === l.docId) : all.filter((d) => !l.filter || d[l.filter[0]] === l.filter[1]);
      setTimeout(() => { if (this.listeners.includes(l)) l.cb(l.docId ? docs[0] || null : docs); }, 0);
    }
    listen(col, cb, filter) {
      const l = { col, cb, filter };
      this.listeners.push(l);
      this.emit(l);
      return () => { this.listeners = this.listeners.filter((x) => x !== l); };
    }
    listenDoc(col, id, cb) {
      const l = { col, cb, docId: id };
      this.listeners.push(l);
      this.emit(l);
      return () => { this.listeners = this.listeners.filter((x) => x !== l); };
    }
    async get(col, id) {
      const d = this.col(col)[id];
      return d ? Object.assign(clone(d), { id }) : null;
    }
    tx(fn) {
      const run = async () => {
        this.load(); // pick up writes from other tabs first
        const work = clone(this.data.cols);
        const touched = new Set();
        const t = {
          get: async (c, id) => { const d = (work[c] || {})[id]; return d ? Object.assign(clone(d), { id }) : null; },
          set: (c, id, d) => { (work[c] = work[c] || {})[id] = clone(d); touched.add(c); },
          update: (c, id, d) => {
            const cur = (work[c] || {})[id];
            if (!cur) throw new Error('Record not found: ' + c + '/' + id);
            applyUpdate(cur, clone(d));
            touched.add(c);
          },
          delete: (c, id) => { if (work[c]) delete work[c][id]; touched.add(c); },
        };
        const res = await fn(t);
        const prev = this.data.cols;
        this.data.cols = work;
        try { this.save(); } catch (e) { this.data.cols = prev; throw e; }
        this.listeners.filter((l) => touched.has(l.col)).forEach((l) => this.emit(l));
        return res;
      };
      const p = this.queue.then(run, run);
      this.queue = p.catch(() => {});
      return p;
    }
    set(col, id, data) { return this.tx((t) => t.set(col, id, data)); }
    update(col, id, data) { return this.tx((t) => t.update(col, id, data)); }
    del(col, id) { return this.tx((t) => t.delete(col, id)); }

    // ---- auth
    onAuth(cb) {
      this.authCb = cb;
      let uid = null;
      try { uid = localStorage.getItem(this.sessionKey); } catch (e) {}
      setTimeout(() => cb(uid || null), 0);
    }
    async signIn(username, pw) {
      const u = this.data.auth[cleanUsername(username)];
      if (!u || u.hash !== (await hashPw(pw, u.salt))) throw new Error('Wrong username or password.');
      try { localStorage.setItem(this.sessionKey, u.uid); } catch (e) {}
      if (this.authCb) this.authCb(u.uid);
    }
    async signOut() {
      try { localStorage.removeItem(this.sessionKey); } catch (e) {}
      if (this.authCb) this.authCb(null);
    }
    async createAccount(username, pw) {
      const key = cleanUsername(username);
      this.load();
      if (this.data.auth[key]) throw new Error('That username is already taken.');
      if (String(pw).length < 6) throw new Error('Password must be at least 6 characters.');
      const uid = genId();
      const salt = genId();
      this.data.auth[key] = { uid, salt, hash: await hashPw(pw, salt) };
      this.save();
      return uid;
    }
    async createFirstAdmin(username, pw, profile) {
      const existing = await this.get('meta', 'setup');
      if (existing) throw new Error('The administrator account has already been created. Please log in.');
      const uid = await this.createAccount(username, pw);
      const now = Date.now();
      await this.tx((t) => {
        t.set('meta', 'setup', { adminUid: uid, at: now });
        t.set('users', uid, Object.assign({ uid, username: cleanUsername(username), role: 'admin', active: true, createdAt: now, photo: '', phone: '' }, profile));
        t.set('meta', 'settings', Object.assign(clone(DEFAULT_SETTINGS), { updatedAt: now }));
        t.set('meta', 'counters', { product: 0, sale: 0 });
      });
      return uid;
    }
    async changePassword(username, oldPw, newPw) {
      const key = cleanUsername(username);
      const u = this.data.auth[key];
      if (!u || u.hash !== (await hashPw(oldPw, u.salt))) throw new Error('Current password is wrong.');
      if (String(newPw).length < 6) throw new Error('Password must be at least 6 characters.');
      u.salt = genId();
      u.hash = await hashPw(newPw, u.salt);
      this.save();
    }
    async adminResetPassword(username, newPw) {
      const u = this.data.auth[cleanUsername(username)];
      if (!u) throw new Error('Login not found.');
      if (String(newPw).length < 6) throw new Error('Password must be at least 6 characters.');
      u.salt = genId();
      u.hash = await hashPw(newPw, u.salt);
      this.save();
    }
    exportAll() { return clone(this.data.cols); }
  }

  // ---------------------------------------------------------------- Firebase backend
  function friendlyAuthError(e) {
    const c = (e && e.code) || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return 'Wrong username or password.';
    if (/email-already-in-use/.test(c)) return 'That username is already taken.';
    if (/weak-password/.test(c)) return 'Password must be at least 6 characters.';
    if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a few minutes and try again.';
    if (/network-request-failed/.test(c)) return 'No internet connection. Check your network and try again.';
    if (/operation-not-allowed|configuration-not-found/.test(c)) return 'Email/Password sign-in is not enabled in the Firebase console (Authentication > Sign-in method).';
    if (/requires-recent-login/.test(c)) return 'Please log out and log in again, then retry.';
    return (e && e.message) || 'Something went wrong.';
  }

  class FirebaseBackend {
    constructor(cfg) { this.mode = 'firebase'; this.cfg = cfg; }
    async init() {
      const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VER + '/';
      await loadScript(base + 'firebase-app-compat.js');
      await loadScript(base + 'firebase-auth-compat.js');
      await loadScript(base + 'firebase-firestore-compat.js');
      this.app = firebase.initializeApp(this.cfg);
      this.auth = firebase.auth();
      this.fs = firebase.firestore();
      this.onError = null;
    }
    ref(c, id) { return this.fs.collection(c).doc(id); }
    listen(col, cb, filter) {
      let q = this.fs.collection(col);
      if (filter) q = q.where(filter[0], '==', filter[1]);
      return q.onSnapshot(
        (s) => cb(s.docs.map((d) => Object.assign(d.data(), { id: d.id }))),
        (e) => { console.error(col, e); if (this.onError) this.onError(e, col); }
      );
    }
    listenDoc(col, id, cb) {
      return this.ref(col, id).onSnapshot(
        (s) => cb(s.exists ? Object.assign(s.data(), { id: s.id }) : null),
        (e) => { console.error(col, e); if (this.onError) this.onError(e, col); }
      );
    }
    async get(col, id) {
      const s = await this.ref(col, id).get();
      return s.exists ? Object.assign(s.data(), { id: s.id }) : null;
    }
    tx(fn) {
      return this.fs.runTransaction(async (T) => {
        const t = {
          get: async (c, id) => { const s = await T.get(this.ref(c, id)); return s.exists ? Object.assign(s.data(), { id: s.id }) : null; },
          set: (c, id, d) => { T.set(this.ref(c, id), d); },
          update: (c, id, d) => { T.update(this.ref(c, id), d); },
          delete: (c, id) => { T.delete(this.ref(c, id)); },
        };
        return fn(t);
      });
    }
    set(col, id, data) { return this.ref(col, id).set(data); }
    update(col, id, data) { return this.ref(col, id).update(data); }
    del(col, id) { return this.ref(col, id).delete(); }

    email(u) { return cleanUsername(u) + '@' + EMAIL_DOMAIN; }
    onAuth(cb) { this.auth.onAuthStateChanged((u) => cb(u ? u.uid : null)); }
    async signIn(username, pw) {
      try { await this.auth.signInWithEmailAndPassword(this.email(username), pw); } catch (e) { throw new Error(friendlyAuthError(e)); }
    }
    async signOut() { await this.auth.signOut(); }
    async createAccount(username, pw) {
      // A secondary app instance creates the login without signing the admin out.
      const sec = firebase.initializeApp(this.cfg, 'sec-' + genId());
      try {
        const c = await sec.auth().createUserWithEmailAndPassword(this.email(username), pw);
        return c.user.uid;
      } catch (e) {
        throw new Error(friendlyAuthError(e));
      } finally {
        try { await sec.auth().signOut(); } catch (e) {}
        try { await sec.delete(); } catch (e) {}
      }
    }
    async createFirstAdmin(username, pw, profile) {
      const existing = await this.get('meta', 'setup');
      if (existing) throw new Error('The administrator account has already been created. Please log in.');
      let cred;
      try { cred = await this.auth.createUserWithEmailAndPassword(this.email(username), pw); } catch (e) {
        // login exists from an interrupted earlier setup: sign in and finish it
        if (/email-already-in-use/.test(e.code || '')) { try { cred = await this.auth.signInWithEmailAndPassword(this.email(username), pw); } catch (e2) { throw new Error(friendlyAuthError(e2)); } }
        else throw new Error(friendlyAuthError(e));
      }
      const uid = cred.user.uid;
      const now = Date.now();
      const b = this.fs.batch();
      b.set(this.ref('meta', 'setup'), { adminUid: uid, at: now });
      b.set(this.ref('users', uid), Object.assign({ uid, username: cleanUsername(username), role: 'admin', active: true, createdAt: now, photo: '', phone: '' }, profile));
      await b.commit();
      const b2 = this.fs.batch();
      b2.set(this.ref('meta', 'settings'), Object.assign(clone(DEFAULT_SETTINGS), { updatedAt: now }));
      b2.set(this.ref('meta', 'counters'), { product: 0, sale: 0 });
      await b2.commit();
      return uid;
    }
    async changePassword(username, oldPw, newPw) {
      const user = this.auth.currentUser;
      try {
        const cred = firebase.auth.EmailAuthProvider.credential(this.email(username), oldPw);
        await user.reauthenticateWithCredential(cred);
        await user.updatePassword(newPw);
      } catch (e) {
        const m = friendlyAuthError(e);
        throw new Error(m === 'Wrong username or password.' ? 'Current password is wrong.' : m);
      }
    }
  }

  // ---------------------------------------------------------------- Business logic
  function Logic(backend, getActor) {
    const actor = () => {
      const a = getActor();
      if (!a || !a.uid) throw new Error('You are not logged in.');
      return a;
    };
    const requireAdmin = () => {
      const a = actor();
      if (a.role !== 'admin') throw new Error('Only the administrator can do this.');
      return a;
    };
    const num = (v, name, opts) => {
      const n = Number(v);
      opts = opts || {};
      if (v === '' || v == null || !isFinite(n)) throw new Error(name + ' must be a number.');
      if (opts.int && !Number.isInteger(n)) throw new Error(name + ' must be a whole number.');
      if (opts.min != null && n < opts.min) throw new Error(name + ' cannot be less than ' + opts.min + '.');
      return n;
    };
    const move = (t, a, p, type, change, before, after, note, ref) => {
      const id = genId();
      t.set('stockMoves', id, {
        productId: p.id, productName: p.name, type, change, before, after,
        note: note || '', ref: ref || '', by: a.uid, byName: a.name, at: Date.now(),
      });
    };
    const audit = (t, a, action, details) => {
      t.set('audit', genId(), { action, details, by: a.uid, byName: a.name, at: Date.now() });
    };

    // shared product field validation (unit of measure + optional pack/bale)
    function productFields(input) {
      const name = String(input.name || '').trim();
      if (!name) throw new Error('Product name is required.');
      const unit = UNITS[input.unit] ? input.unit : 'pcs';
      const dec = !!UNITS[unit].dec;
      const f = {
        name, nameLower: name.toLowerCase(), category: String(input.category || 'Other'), unit,
        buyPrice: r2(num(input.buyPrice, 'Buying price', { min: 0 })),
        sellPrice: r2(num(input.sellPrice, 'Selling price', { min: 0 })),
        minStock: num(input.minStock == null || input.minStock === '' ? 5 : input.minStock, 'Minimum stock level', { min: 0, int: !dec }),
        description: String(input.description || '').trim(),
        dateAdded: input.dateAdded || dayKey(Date.now()),
        packName: '', packSize: 0, packPrice: 0,
      };
      if (input.packEnabled === true || input.packEnabled === 'true' || input.packEnabled === 'on') {
        const pn = String(input.packName || '').trim().toLowerCase();
        if (!pn) throw new Error('Enter the pack name (e.g. bale, carton, sack).');
        const size = num(input.packSize, 'Units inside one ' + pn, { min: 0, int: !dec });
        if (size <= 0) throw new Error('Enter how many ' + unit + ' are inside one ' + pn + '.');
        f.packName = pn;
        f.packSize = r3(size);
        f.packPrice = input.packPrice === '' || input.packPrice == null ? r2(size * f.sellPrice) : r2(num(input.packPrice, 'Selling price per ' + pn, { min: 0 }));
      }
      return f;
    }
    function toUnits(f, amount, amountIn, label) {
      const v = num(amount, label, { min: 0 });
      if (amountIn === 'pack') {
        if (!f.packSize) throw new Error('This product has no pack size.');
        if (!Number.isInteger(v)) throw new Error(label + ': enter whole ' + plural(f.packName, 2) + '.');
        return r3(v * f.packSize);
      }
      if (!UNITS[f.unit || 'pcs'] || !UNITS[f.unit || 'pcs'].dec) { if (!Number.isInteger(v)) throw new Error(label + ' must be a whole number.'); }
      return r3(v);
    }

    async function addProduct(input) {
      const a = requireAdmin();
      const f = productFields(input);
      const qty = toUnits(f, input.qty === '' || input.qty == null ? 0 : input.qty, input.qtyIn, 'Initial stock quantity');
      return backend.tx(async (t) => {
        const counters = (await t.get('meta', 'counters')) || { product: 0, sale: 0 };
        const n = (counters.product || 0) + 1;
        const id = 'P' + pad(n, 4);
        const now = Date.now();
        const p = Object.assign({ id }, f, { qty, createdAt: now, updatedAt: now, createdBy: a.uid });
        t.set('meta', 'counters', Object.assign({}, counters, { product: n }));
        t.set('products', id, p);
        if (qty > 0) move(t, a, p, 'initial', qty, 0, qty, 'Opening stock');
        return p;
      });
    }

    async function updateProduct(id, input) {
      requireAdmin();
      const upd = Object.assign(productFields(input), { updatedAt: Date.now() });
      return backend.tx(async (t) => {
        const p = await t.get('products', id);
        if (!p) throw new Error('Product not found. It may have been deleted.');
        if ((p.unit || 'pcs') !== upd.unit && !UNITS[upd.unit].dec && !Number.isInteger(p.qty)) throw new Error('Current stock (' + p.qty + ') is not a whole number - fix the stock count before changing the unit to ' + upd.unit + '.');
        t.update('products', id, upd);
      });
    }

    /** amountIn: 'unit' (default) or 'pack' - e.g. receive 4 bales. newBuyPrice is per base unit. */
    async function adjustStock(id, mode, amount, note, newBuyPrice, amountIn) {
      const a = requireAdmin();
      return backend.tx(async (t) => {
        const p = await t.get('products', id);
        if (!p) throw new Error('Product not found.');
        const amt = toUnits(p, amount, amountIn, 'Quantity');
        if (mode !== 'set' && amt <= 0) throw new Error('Quantity must be more than 0.');
        const before = p.qty;
        let after = before;
        if (mode === 'add') after = r3(before + amt);
        else if (mode === 'remove') after = r3(before - amt);
        else after = amt;
        if (after < 0) throw new Error('Cannot remove ' + fmtQ(amt) + ' ' + (p.unit || 'pcs') + ' - only ' + fmtQ(before) + ' in stock.');
        const upd = { qty: after, updatedAt: Date.now() };
        if (newBuyPrice !== undefined && newBuyPrice !== '' && newBuyPrice !== null) upd.buyPrice = r2(num(newBuyPrice, 'Buying price', { min: 0 }));
        t.update('products', id, upd);
        const type = mode === 'add' ? 'restock' : mode === 'remove' ? 'removal' : 'adjustment';
        move(t, a, p, type, r3(after - before), before, after, (amountIn === 'pack' ? fmtQ(amount) + ' ' + plural(p.packName, Number(amount)) + '. ' : '') + (note || ''));
        return after;
      });
    }

    async function deleteProduct(id) {
      const a = requireAdmin();
      return backend.tx(async (t) => {
        const p = await t.get('products', id);
        if (!p) return;
        t.delete('products', id);
        audit(t, a, 'product_deleted', { productId: id, name: p.name, qty: p.qty });
      });
    }

    /**
     * Complete a sale atomically.
     * items: [{productId, qty}], payment: {amountPaid, method, customerName, customerPhone}
     * saleId must be generated once per cart - a retry with the same id cannot record twice.
     */
    async function completeSale(saleId, items, payment) {
      const a = actor();
      if (!saleId) throw new Error('Missing sale id.');
      const reqs = (items || []).map((it) => ({ productId: it.productId, mode: it.mode || 'unit', value: it.value != null ? it.value : it.qty }));
      const ids = Array.from(new Set(reqs.map((r) => r.productId)));
      if (!ids.length) throw new Error('Add at least one product to the sale.');
      const paid = r2(num(payment.amountPaid, 'Amount paid', { min: 0 }));
      const method = ['Cash', 'M-Pesa', 'Bank', 'Other'].includes(payment.method) ? payment.method : 'Cash';
      const customerName = String(payment.customerName || '').trim();
      const customerPhone = String(payment.customerPhone || '').trim();
      const reference = String(payment.reference || '').trim();

      return backend.tx(async (t) => {
        // ---- all reads first (required by Firestore transactions)
        const dup = await t.get('sales', saleId);
        if (dup) throw new Error('This sale was already recorded (receipt ' + dup.receiptNo + ').');
        const counters = (await t.get('meta', 'counters')) || { product: 0, sale: 0 };
        const prods = {};
        for (const id of ids) prods[id] = await t.get('products', id);

        // ---- validate & compute
        const lines = [];
        const need = {};
        for (const r of reqs) {
          const p = prods[r.productId];
          if (!p) throw new Error('A product in the cart no longer exists. Remove it and try again.');
          const x = resolveLine(p, r.mode, r.value);
          const unitCost = r2(p.buyPrice);
          const cost = r2(unitCost * x.qty);
          need[p.id] = r3((need[p.id] || 0) + x.qty);
          lines.push({
            productId: p.id, name: p.name, category: p.category || '', unit: p.unit || 'pcs',
            mode: x.mode, value: x.value, qty: x.qty, qtyText: x.qtyText, rate: x.rate, rateUnit: x.rateUnit,
            unitPrice: x.qty ? r2(x.subtotal / x.qty) : 0, unitCost, subtotal: x.subtotal, cost, profit: r2(x.subtotal - cost),
          });
        }
        for (const id of ids) {
          const p = prods[id];
          if (need[id] > p.qty + 1e-9) throw new Error('Not enough stock for "' + p.name + '": only ' + stockText(p) + ' available, you tried to sell ' + fmtQ(need[id]) + ' ' + (p.unit || 'pcs') + '.');
        }
        const total = r2(lines.reduce((s, l) => s + l.subtotal, 0));
        const totalCost = r2(lines.reduce((s, l) => s + l.cost, 0));
        const applied = r2(Math.min(paid, total));
        const balanceDue = r2(total - applied);
        const change = r2(Math.max(0, paid - total));
        if (balanceDue > 0) {
          if (customerName.length < 3) throw new Error("The customer has not paid in full. Enter the customer's full name.");
          if (!/^[+0-9][0-9 ]{8,15}$/.test(customerPhone)) throw new Error("The customer has not paid in full. Enter a valid phone number (e.g. 0712345678).");
        }
        const n = (counters.sale || 0) + 1;
        const now = Date.now();
        const receiptNo = 'SGS-' + dayKey(now).replace(/-/g, '') + '-' + pad(n, 5);
        const sale = {
          id: saleId, receiptNo, seq: n, at: now, dateKey: dayKey(now),
          sellerId: a.uid, sellerName: a.name,
          items: lines, itemCount: r3(lines.reduce((s, l) => s + l.qty, 0)),
          total, totalCost, profit: r2(total - totalCost),
          amountPaid: paid, amountApplied: applied, change, balanceDue,
          paymentStatus: balanceDue <= 0 ? 'paid' : applied > 0 ? 'partial' : 'unpaid',
          method, reference, customerName, customerPhone,
          payments: applied > 0 ? [{ amount: applied, method, at: now, by: a.uid, byName: a.name, note: 'At sale' }] : [],
          reversed: false, status: 'completed', clearedAt: balanceDue <= 0 ? now : null,
        };

        // ---- writes
        for (const id of ids) {
          const p = prods[id];
          const after = r3(p.qty - need[id]);
          t.update('products', id, { qty: after, updatedAt: now });
          move(t, a, p, 'sale', -need[id], p.qty, after, 'Sold ' + lines.filter((l) => l.productId === id).map((l) => l.qtyText).join(' + '), receiptNo);
        }
        t.set('sales', saleId, sale);
        t.set('meta', 'counters', Object.assign({}, counters, { sale: n }));
        return sale;
      });
    }

    async function recordPayment(saleId, amount, method, note) {
      const a = actor();
      const amt = r2(num(amount, 'Amount', { min: 0 }));
      if (amt <= 0) throw new Error('Enter the amount the customer has paid.');
      return backend.tx(async (t) => {
        const s = await t.get('sales', saleId);
        if (!s) throw new Error('Sale not found.');
        if (s.reversed) throw new Error('This sale was reversed.');
        if (a.role !== 'admin' && s.sellerId !== a.uid) throw new Error('Only the seller who made this sale or the administrator can record its payments.');
        if (s.balanceDue <= 0) throw new Error('This sale is already fully paid.');
        if (amt > s.balanceDue + 0.001) throw new Error('Amount is more than the balance due (' + s.balanceDue + ').');
        const now = Date.now();
        const applied = r2(s.amountApplied + amt);
        const balanceDue = r2(s.total - applied);
        const payments = (s.payments || []).concat([{ amount: amt, method: method || 'Cash', at: now, by: a.uid, byName: a.name, note: String(note || 'Debt payment') }]);
        t.update('sales', saleId, {
          payments, amountApplied: applied, balanceDue,
          paymentStatus: balanceDue <= 0 ? 'paid' : 'partial',
          clearedAt: balanceDue <= 0 ? now : null, updatedAt: now,
        });
        return balanceDue;
      });
    }

    async function updateDebtor(saleId, name, phone) {
      const a = actor();
      return backend.tx(async (t) => {
        const s = await t.get('sales', saleId);
        if (!s) throw new Error('Sale not found.');
        if (a.role !== 'admin' && s.sellerId !== a.uid) throw new Error('Not allowed.');
        t.update('sales', saleId, { customerName: String(name || '').trim(), customerPhone: String(phone || '').trim(), updatedAt: Date.now() });
      });
    }

    async function reverseSale(saleId, reason) {
      const a = requireAdmin();
      reason = String(reason || '').trim();
      if (reason.length < 3) throw new Error('Enter the reason for reversing this sale.');
      return backend.tx(async (t) => {
        const s = await t.get('sales', saleId);
        if (!s) throw new Error('Sale not found.');
        if (s.reversed) throw new Error('This sale was already reversed.');
        const prods = {};
        for (const l of s.items) if (!(l.productId in prods)) prods[l.productId] = await t.get('products', l.productId);
        const now = Date.now();
        const qtyNow = {};
        for (const l of s.items) {
          const p = prods[l.productId];
          if (!p) continue; // product deleted - nothing to restock
          const before = qtyNow[p.id] != null ? qtyNow[p.id] : p.qty;
          const after = r3(before + l.qty);
          qtyNow[p.id] = after;
          move(t, a, p, 'reversal', l.qty, before, after, 'Sale reversed: ' + reason, s.receiptNo);
        }
        for (const id of Object.keys(qtyNow)) t.update('products', id, { qty: qtyNow[id], updatedAt: now });
        t.update('sales', saleId, { reversed: true, status: 'reversed', reversedAt: now, reversedBy: a.uid, reversedByName: a.name, reverseReason: reason, updatedAt: now });
        audit(t, a, 'sale_reversed', { saleId, receiptNo: s.receiptNo, total: s.total, sellerName: s.sellerName, reason });
      });
    }

    // ---- users
    async function createUser(input) {
      const a = requireAdmin();
      const username = cleanUsername(input.username);
      if (!validUsername(username)) throw new Error('Username must be 3-30 characters: letters, numbers, dot, dash or underscore (no spaces).');
      const name = String(input.name || '').trim();
      if (!name) throw new Error("Enter the user's full name.");
      if (String(input.password || '').length < 6) throw new Error('Password must be at least 6 characters.');
      const role = input.role === 'admin' ? 'admin' : 'seller';
      const uid = await backend.createAccount(username, input.password);
      const now = Date.now();
      await backend.tx(async (t) => {
        t.set('users', uid, { uid, username, name, role, phone: String(input.phone || '').trim(), photo: '', active: true, createdAt: now, createdBy: a.uid });
        audit(t, a, 'user_created', { uid, username, role });
      });
      return uid;
    }
    async function adminUpdateUser(uid, input) {
      const a = requireAdmin();
      if (uid === a.uid && (input.active === false || input.role === 'seller')) throw new Error('You cannot disable or demote your own account.');
      return backend.tx(async (t) => {
        const u = await t.get('users', uid);
        if (!u) throw new Error('User not found.');
        const upd = {};
        if (input.name != null) upd.name = String(input.name).trim() || u.name;
        if (input.phone != null) upd.phone = String(input.phone).trim();
        if (input.role) upd.role = input.role === 'admin' ? 'admin' : 'seller';
        if (input.active != null) upd.active = !!input.active;
        if (input.salary != null && input.salary !== '') upd.salary = r2(num(input.salary, 'Salary', { min: 0 }));
        if (input.salaryPeriod) upd.salaryPeriod = input.salaryPeriod === 'weekly' ? 'weekly' : 'monthly';
        if (input.commissionRate != null && input.commissionRate !== '') {
          upd.commissionRate = num(input.commissionRate, 'Commission rate', { min: 0 });
          if (upd.commissionRate > 100) throw new Error('Commission rate cannot be more than 100%.');
        }
        t.update('users', uid, upd);
        audit(t, a, 'user_updated', Object.assign({ uid, username: u.username }, upd));
      });
    }
    async function updateMyProfile(input) {
      const a = actor();
      const upd = {};
      if (input.name != null) { const n = String(input.name).trim(); if (!n) throw new Error('Name cannot be empty.'); upd.name = n; }
      if (input.phone != null) upd.phone = String(input.phone).trim();
      if (input.photo != null) {
        if (input.photo && input.photo.length > 200000) throw new Error('Photo is too large.');
        upd.photo = input.photo;
      }
      if (input.mustChangePassword === false) upd.mustChangePassword = false;
      return backend.update('users', a.uid, upd);
    }

    // ---- salaries & commission
    const PAY_TYPES = ['salary', 'commission', 'bonus', 'advance', 'other'];
    /** input: {id?, sellerId, type, amount, method, reference, note, periodKey, periodLabel, from, to, basis, message} */
    async function payStaff(input) {
      const a = requireAdmin();
      const amount = r2(num(input.amount, 'Amount', { min: 0 }));
      if (amount <= 0) throw new Error('Enter the amount to pay.');
      const type = PAY_TYPES.includes(input.type) ? input.type : 'other';
      const id = input.id || genId();
      return backend.tx(async (t) => {
        const u = await t.get('users', input.sellerId);
        if (!u) throw new Error('Seller not found.');
        const ex = await t.get('payroll', id);
        if (ex && ex.status !== 'void') throw new Error('Already paid: ' + (ex.periodLabel || ex.type) + ' - ' + ex.amount + ' was paid on ' + new Date(ex.paidAt).toLocaleDateString('en-GB') + '.');
        const now = Date.now();
        const rec = {
          id, sellerId: input.sellerId, sellerName: u.name, type, amount,
          method: ['Cash', 'M-Pesa', 'Bank', 'Other'].includes(input.method) ? input.method : 'Cash',
          reference: String(input.reference || '').trim(), note: String(input.note || '').trim(),
          periodKey: input.periodKey || '', periodLabel: input.periodLabel || '', from: input.from || null, to: input.to || null,
          basis: input.basis || null, status: 'paid', paidAt: now, paidBy: a.uid, paidByName: a.name, receivedAt: null,
        };
        t.set('payroll', id, rec);
        const mid = genId();
        const readBy = {};
        readBy[a.uid] = true;
        t.set('messages', mid, { id: mid, threadId: mid, fromUid: a.uid, fromName: a.name, fromRole: 'admin', toUid: input.sellerId, text: String(input.message || ('Payment sent: ' + amount)), at: now, readBy, kind: 'payment' });
        audit(t, a, 'staff_paid', { sellerName: u.name, type, amount, period: rec.periodLabel });
        return rec;
      });
    }
    async function voidPayment(id, reason) {
      const a = requireAdmin();
      reason = String(reason || '').trim();
      if (reason.length < 3) throw new Error('Enter the reason for cancelling this payment.');
      return backend.tx(async (t) => {
        const p = await t.get('payroll', id);
        if (!p) throw new Error('Payment not found.');

  async function boot() {
    const cfg = window.SHALOM_FIREBASE_CONFIG;
    S.backend = cfg && cfg.apiKey ? new C.FirebaseBackend(cfg) : new C.LocalBackend();
    try { await S.backend.init(); } catch (e) {
      $('#root').innerHTML = '<div class="boot-screen"><h2>Cannot start</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Retry</button></div>';
      return;
    }
    S.backend.onError = (e, col) => {
      const k = 'err-' + col;
      if (S.popped.has(k)) return;
      S.popped.add(k);
      toast('Database access problem (' + col + '): ' + (e.code === 'permission-denied' ? 'permission denied - check that firestore.rules are published.' : e.message), 'error');
    };
    S.logic = C.Logic(S.backend, actor);
    S.backend.onAuth(handleAuth);
  }
  async function handleAuth(uid) {
    if (S.settingUp) return;
    teardown();
    if (!uid) { showLogin(); return; }
    let me = null;
    try { me = await S.backend.get('users', uid); } catch (e) { console.error(e); }
    if (!me) { await S.backend.signOut(); showLogin('This login has no user profile. Ask the administrator.'); return; }
    if (me.active === false) { await S.backend.signOut(); showLogin('This account has been disabled. Contact the shop administrator.'); return; }
    S.uid = uid;
    S.me = me;
    S.roleAtStart = me.role;
    startApp();
  }
  function teardown() {
    S.unsubs.forEach((u) => { try { u(); } catch (e) {} });
    S.unsubs = [];
    S.timers.forEach(clearInterval);
    S.timers = [];
    Object.values(S.charts).forEach((c) => { try { c.destroy(); } catch (e) {} });
    S.charts = {};
    Object.assign(S, { uid: null, me: null, users: [], products: [], sales: [], payroll: [], messages: [], stockMoves: [], audit: [], loaded: {}, route: null, view: null });
    $('#modalRoot').innerHTML = '';
  }
  async function logout() {

    await S.backend.signOut();

    finally {

      refresh();

      if (d) { const x = Object.assign({}, d); delete x.id; S.settings = Object.assign({}, C.DEFAULT_SETTINGS, x); }

    sub(b.listen('payroll', (d) => { S.payroll = d.sort((x, y) => y.paidAt - x.paidAt); refresh(); }, admin ? null : ['sellerId', S.uid]));

      };
      [['toUid', S.uid], ['toUid', 'all'], ['fromUid', S.uid]].forEach((f, i) => sub(b.listen('messages', (d) => { parts[i] = d; merge(); }, f)));

    S.timers.push(setInterval(() => { updateBadges(); runPopups(); if (S.view && S.view.tick) S.view.tick(); }, 60000));
    setTimeout(() => {

  // ---------- derived data

      if (isAdmin()) return m.toUid === 'admins' || m.toUid === me || m.toUid === 'all';

  const mySales = () => (isAdmin() ? S.sales : S.sales.filter((s) => s.sellerId === S.uid));

  function route() {

  // ================================================================ charts
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const isDark = () => document.documentElement.dataset.mode === 'dark';
  // read the theme colours when a chart is drawn (charts are redrawn on theme change)
  const COLS = { get sales() { return cssVar('--green-600') || '#16a34a'; }, get profit() { return isDark() ? '#9ca3af' : '#374151'; } };
  function barChart(canvas, key, labels, series) {
    const tick = isDark() ? '#9aa5b4' : '#6b7280';
    const grid = isDark() ? '#2a3546' : '#eef0f3';
    if (!canvas) return;
    if (!window.Chart) { canvas.parentElement.innerHTML = '<div class="empty">Charts need an internet connection to load.</div>'; return; }
    const existing = S.charts[key];
    if (existing && existing.canvas === canvas && existing.data.datasets.length === series.length) {
      existing.data.labels = labels;
      series.forEach((s, i) => { existing.data.datasets[i].data = s.data; });
      existing.update('none');
      return;
    }
    if (existing) existing.destroy();
    S.charts[key] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: series.map((s) => ({ label: s.label, data: s.data, backgroundColor: s.color, hoverBackgroundColor: s.color, borderRadius: 4, maxBarThickness: 22, categoryPercentage: 0.72, barPercentage: 0.92 })),
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: series.length > 1, position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, color: tick } },
          tooltip: { callbacks: { label: (c) => ' ' + c.dataset.label + ': ' + money(c.parsed.y) } },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: tick, maxRotation: 0, autoSkip: true } },
          y: { beginAtZero: true, suggestedMax: 100, grid: { color: grid }, border: { display: false }, ticks: { color: tick, precision: 0, callback: (v) => shortMoney(v) } },
        },
      },
    });
  }
  function dailySeries(sales, from, days) {
    const labels = [];
    const rev = [];
    const prof = [];
    for (let i = 0; i < days; i++) {
      const a = addDays(from, i);
      const b = addDays(from, i + 1);
      const sm = Reports.summarize(Reports.between(sales, a, b));
      const d = new Date(a);
      labels.push(d.getDate() + ' ' + MONTHS[d.getMonth()]);
      rev.push(sm.revenue);
      prof.push(sm.profit);
    }
    return { labels, rev, prof };
  }

  function printHTML(html, page) {
    const pa = $('#printArea');
    pa.innerHTML = '<style>@page { size: ' + page + '; margin: ' + (page === 'A4' ? '14mm' : '2mm') + '; }</style>' + html;
    setTimeout(() => {

  function printReceipt(s) {
    const paper = S.settings.receiptPaper || '80mm';
    if (paper === 'A4') return printHTML(receiptHTML(s, true), 'A4');
    const w = paper === '58mm' ? 58 : 80;
    printHTML('<div style="width:' + (w - 6) + 'mm">' + receiptHTML(s, false).replace('class="receipt "', 'class="receipt" style="max-width:none;font-size:' + (w === 58 ? '10px' : '11.5px') + '"') + '</div>', w + 'mm auto');
  }
  function jsPDFCtor() { return window.jspdf && window.jspdf.jsPDF; }
  function pdfReceipt(s) {
    const JsPDF = jsPDFCtor();
    if (!JsPDF) { toast('PDF tool could not load (needs internet). Use Print and choose "Save as PDF".', 'error'); return; }
    const st = S.settings;
    const W = (S.settings.receiptPaper === '58mm') ? 58 : 80;
    const M = 4;
    const inner = W - 2 * M;
    const fs = W === 58 ? 7.5 : 8.5;
    const lh = fs * 0.45;
    const draw = (doc, real) => {
      let y = M + 2;
      const center = (t, bold, size) => {
        doc.setFont('courier', bold ? 'bold' : 'normal');
        doc.setFontSize(size || fs);
        doc.splitTextToSize(String(t), inner).forEach((ln) => { if (real) doc.text(ln, W / 2, y, { align: 'center' }); y += (size || fs) * 0.45; });
      };
      const row = (l, r, bold) => {
        doc.setFont('courier', bold ? 'bold' : 'normal');
        doc.setFontSize(fs);
        const ls = doc.splitTextToSize(String(l), inner - doc.getTextWidth(String(r)) - 2);
        ls.forEach((ln, i) => { if (real) { doc.text(ln, M, y); if (i === 0) doc.text(String(r), W - M, y, { align: 'right' }); } y += lh; });
      };
      const hr = () => { if (real) { doc.setLineDashPattern([0.8, 0.8], 0); doc.line(M, y - lh / 2, W - M, y - lh / 2); } y += lh * 0.7; };
      center(st.shopName || 'SHALOM GENERAL STORE', true, fs + 3);
      if (st.address) center(st.address);
      if (st.phone) center('Tel: ' + st.phone);
      if (st.email) center(st.email);
      if (st.kraPin) center('PIN: ' + st.kraPin);
      center('SALES RECEIPT', true);
      hr();
      row('Receipt No:', s.receiptNo, true);
      row('Date:', fmtD(s.at) + ' ' + fmtT(s.at));
      row('Served by:', s.sellerName);
      if (s.customerName) row('Customer:', s.customerName);
      if (s.customerPhone) row('Phone:', s.customerPhone);
      hr();
      s.items.forEach((l) => {
        doc.setFont('courier', 'normal'); doc.setFontSize(fs);
        doc.splitTextToSize(l.name, inner).forEach((ln) => { if (real) doc.text(ln, M, y); y += lh; });
        row('  ' + lineQty(l) + ' x ' + fmtNum(l.rate != null ? l.rate : l.unitPrice) + (l.rateUnit ? '/' + l.rateUnit : ''), fmtNum(l.subtotal));
      });
      hr();
      row('Items:', String(s.itemCount));
      row('TOTAL (' + cur() + '):', fmtNum(s.total), true);
      row('Paid (' + s.method + '):', fmtNum(s.amountPaid));
      if (s.reference) row('Ref:', s.reference);
      row('Change:', fmtNum(s.change));
      (s.payments || []).slice(1).forEach((p) => row('Paid ' + fmtD(p.at) + ':', fmtNum(p.amount)));
      if (s.balanceDue > 0 || (s.payments || []).length > 1) row('BALANCE DUE:', fmtNum(s.balanceDue), true);
      row('Payment method:', s.method);
      center(s.reversed ? '*** SALE REVERSED ***' : s.balanceDue > 0 ? '*** NOT FULLY PAID ***' : '*** PAID IN FULL ***', true);
      hr();
      center(st.receiptFooter || C.DEFAULT_SETTINGS.receiptFooter, true);
      hr();
      center(CREDIT_1, false, fs - 1.5);
      center(CREDIT_2, false, fs - 1.5);
      return y + M;
    };
    const probe = new JsPDF({ unit: 'mm', format: [W, 400] });
    const h = Math.max(60, draw(probe, false));
    const doc = new JsPDF({ unit: 'mm', format: [W, h] });
    draw(doc, true);
    doc.save('Receipt-' + s.receiptNo + '.pdf');
  }

  function reportPDF(title, subtitle, blocks, filename) {
    const JsPDF = jsPDFCtor();
    if (!JsPDF || !(JsPDF.API && JsPDF.API.autoTable)) { toast('PDF tool could not load (needs internet). Use Print and choose "Save as PDF".', 'error'); return; }
    const doc = new JsPDF({ unit: 'mm', format: 'a4' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    doc.text(S.settings.shopName || 'SHALOM GENERAL STORE', 14, 16);
    doc.setFontSize(12); doc.text(title, 14, 23);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    doc.text(subtitle + '   ·   Generated ' + fmtDT(Date.now()) + ' by ' + S.me.name, 14, 29);
    let y = 34;
    blocks.forEach((b) => {
      if (b.heading) { doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(b.heading, 14, y + 5); y += 7; }
      doc.autoTable({ startY: y, head: b.head ? [b.head] : undefined, body: b.body, foot: b.foot ? [b.foot] : undefined, theme: 'grid', styles: { fontSize: 8.5, cellPadding: 1.6 }, headStyles: { fillColor: [21, 128, 61] }, footStyles: { fillColor: [229, 231, 235], textColor: 20, fontStyle: 'bold' }, columnStyles: b.colStyles || {}, margin: { left: 14, right: 14 } });
      y = doc.lastAutoTable.finalY + 6;
    });
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110);
      doc.text(CREDIT_1 + '  ·  ' + CREDIT_2, 105, 290, { align: 'center' });
      doc.text('Page ' + i + ' of ' + pages, 196, 290, { align: 'right' });
    }
    doc.save(filename);
  }

      const size = Number(E.packSize.value);
      if (ev && ev.target === E.packBuy && E.packBuy.value !== '' && size > 0) E.buyPrice.value = r2(Number(E.packBuy.value) / size);
      if (E.packPrice.value === '' && size > 0 && E.sellPrice.value !== '') E.packPrice.placeholder = 'auto: ' + fmtNum(size * Number(E.sellPrice.value));

          <div class="field"><label id="stkQtyLbl">Quantity</label><div style="display:flex;gap:6px"><input class="input" type="number" name="amount" min="0" step="any" required>${amountInSelect(p) || '<span class="muted" style="align-self:center">' + esc(unit) + '</span>'}</div></div>

  // ================================================================ popups (messages & debt alerts)
  function runPopups() {
    if (!S.me || $('#modalRoot').children.length) return;
    // 1) new messages
    const unread = myUnread().filter((m) => !S.popped.has('m' + m.id));
    if (unread.length) {
      if (S.route === 'messages' && V.msg && unread.every((m) => m.threadId === V.msg.thread)) return;
      unread.forEach((m) => S.popped.add('m' + m.id));
      messagePopup(unread);
      return;
    }
    // 2) overdue debts (once per login session per sale)
    const od = overdueDebts().filter((s) => !S.popped.has('d' + s.id));
    if (od.length) {
      od.forEach((s) => S.popped.add('d' + s.id));
      const rows = od.map((s) => '<tr><td><b>' + esc(s.customerName || '—') + '</b><br>' + telLink(s.customerPhone) + '</td><td class="num">' + money(s.balanceDue) + '</td><td>' + ago(s.at) + '</td>' + (isAdmin() ? '<td>' + who(s.sellerId, s.sellerName) + '</td>' : '') + '</tr>').join('');
      const m = openModal({
        title: '⚠ Debt follow-up reminder', cls: 'alerting wide', noFocus: true,
        body: '<p>' + (od.length === 1 ? 'This customer has' : 'These ' + od.length + ' customers have') + ' not paid in full for more than <b>' + debtHours() + ' hours</b>. Please follow up.</p><div class="table-wrap"><table class="t"><thead><tr><th>Customer</th><th class="num">Balance</th><th>Sold</th>' + (isAdmin() ? '<th>Sold by</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table></div>',

    }
  }

      footer: '<button class="btn secondary" data-read>Mark as read</button><button class="btn secondary" data-open>Open conversation</button><button class="btn" data-reply>' + icon('send') + 'Send reply</button>',

      const q = V.stk.q.trim().toLowerCase();
      const TYPES = { initial: ['Opening stock', 'b-blue'], restock: ['Restock', 'b-green'], sale: ['Sale', 'b-grey'], removal: ['Removal', 'b-red'], adjustment: ['Stock take', 'b-amber'], reversal: ['Reversal', 'b-blue'] };
      const mv = S.stockMoves.filter((m) => (!q || (m.productName || '').toLowerCase().includes(q) || (m.productId || '').toLowerCase().includes(q)) && (!V.stk.type || m.type === V.stk.type)).slice(0, 300);
      $('#sMoves', root).innerHTML = mv.length ? '<table class="t"><thead><tr><th>Date</th><th>Product</th><th>Type</th><th class="num">Change</th><th class="num">Before</th><th class="num">After</th><th>By</th><th>Note / Ref</th></tr></thead><tbody>' +
        mv.map((m) => { const t = TYPES[m.type] || [m.type, 'b-grey']; return '<tr><td class="nowrap">' + fmtDT(m.at) + '</td><td><b>' + esc(m.productName) + '</b> <span class="muted small">' + esc(m.productId) + '</span></td><td><span class="badge ' + t[1] + '">' + t[0] + '</span></td><td class="num ' + (m.change < 0 ? 'text-red' : 'text-green') + '"><b>' + (m.change > 0 ? '+' : '') + m.change + '</b></td><td class="num">' + m.before + '</td><td class="num">' + m.after + '</td><td>' + esc(m.byName) + '</td><td class="small">' + esc([m.note, m.ref].filter(Boolean).join(' · ')) + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">No stock movements yet.</div>';

  // ---------------------------------------------------------------- New Sale (POS)
  function cartKey() { return 'shalom_cart_' + S.uid; }
  function saveCart() { try { localStorage.setItem(cartKey(), JSON.stringify({ cart: S.cart, id: S.cartSaleId, pay: S.pay })); } catch (e) {} }
  function normLine(l) { return { key: l.key || genId(), productId: l.productId, mode: l.mode || 'unit', value: l.value != null ? l.value : l.qty != null ? l.qty : 1 }; }
  function loadCart() {
    try {
      const d = JSON.parse(localStorage.getItem(cartKey()));
      if (d && Array.isArray(d.cart)) { S.cart = d.cart.map(normLine); S.cartSaleId = d.id || genId(); S.pay = Object.assign({ method: 'Cash', paid: '', name: '', phone: '', ref: '' }, d.pay || {}); return; }
    } catch (e) {}
    S.cart = []; S.cartSaleId = genId(); S.pay = { method: 'Cash', paid: '', name: '', phone: '', ref: '' };
  }
  function resetCart() { S.cart = []; S.cartSaleId = genId(); S.pay = { method: 'Cash', paid: '', name: '', phone: '', ref: '' }; saveCart(); }
  const MODE_DEFAULT = { unit: 1, sub: 250, pack: 1, amount: 50 };
  /** sell modes a product offers: [mode, label] */
  function sellModes(p) {
    const u = C.unitInfo(p);
    const unit = p.unit || 'pcs';
    const m = [['unit', unit + ' (' + money(p.sellPrice) + '/' + unit + ')']];
    if (u.sub) m.push(['sub', u.sub[0] + ' (type ' + u.sub[0] + ')']);
    if (C.hasPack(p)) m.push(['pack', p.packName + ' of ' + C.fmtQ(p.packSize) + ' ' + unit + ' (' + money(C.packPrice(p)) + ')']);
    if (u.dec) m.push(['amount', cur() + ' amount (money worth)']);
    return m;
  }
  function addToCart(pid, mode, value) {
    const p = S.products.find((x) => x.id === pid);
    if (!p) return;
    mode = mode || 'unit';
    const add = value != null ? value : MODE_DEFAULT[mode];
    const line = S.cart.find((l) => l.productId === pid && l.mode === mode && (mode === 'unit' || mode === 'pack'));
    if (line) line.value = C.r3(Number(line.value || 0) + add); else S.cart.push({ key: genId(), productId: pid, mode, value: add });
    const c = cartCalc();
    const bad = c.issues.find((i) => i.includes('"' + p.name + '"') && /available/.test(i));
    if (bad) { if (line) line.value = C.r3(Number(line.value) - add); else S.cart.pop(); toast(bad, 'warn'); }
    saveCart();
  }
  function cartCalc() {
    let total = 0;
    const issues = [];
    const need = {};
    const lines = S.cart.map((l) => {
      const p = S.products.find((x) => x.id === l.productId);
      if (!p) { issues.push('A product in the cart was deleted - remove it.'); return { l, p: null, x: null, sub: 0 }; }
      try {
        const x = C.resolveLine(p, l.mode, l.value);
        need[p.id] = C.r3((need[p.id] || 0) + x.qty);
        total += x.subtotal;
        return { l, p, x, sub: x.subtotal };
      } catch (e) { issues.push(e.message); return { l, p, x: null, sub: 0 }; }
    });
    Object.keys(need).forEach((id) => {
      const p = S.products.find((x) => x.id === id);
      if (need[id] > p.qty + 1e-9) issues.push('Only ' + C.stockText(p) + ' of "' + p.name + '" available - this sale needs ' + qtyU(need[id], p.unit) + '.');
    });
    total = r2(total);
    const paid = S.pay.paid === '' ? NaN : Number(S.pay.paid);
    return { lines, total, paid, issues, need, balance: isNaN(paid) ? total : r2(Math.max(0, total - paid)), change: isNaN(paid) ? 0 : r2(Math.max(0, paid - total)) };
  }
  function lineDesc(x) { return x ? '= ' + x.qtyText + ' @ ' + fmtNum(x.rate) + '/' + x.rateUnit : ''; }
  function chipsFor(p, mode) {
    const u = C.unitInfo(p);
    if (mode === 'unit' && u.dec) return [[0.25, '¼'], [0.5, '½'], [1, '1'], [2, '2'], [5, '5']];
    if (mode === 'sub') return [[100, '100'], [250, '250'], [500, '500'], [750, '750']];
    if (mode === 'amount') return [[20, '20'], [50, '50'], [100, '100'], [200, '200'], [500, '500']];
    return [];
  }

      title: admin ? 'New message to sellers' : 'Message the administrator',

  function threadTitle(root) {

      const other = root.fromRole === 'admin' ? (root.toUid === 'admins' ? null : root.toUid) : root.fromUid;
      const u = other && userById(other);
      return u ? u.name : root.fromRole === 'admin' ? 'Administrators' : root.fromName;
    }
    return root.fromUid === S.uid ? 'Administrator' : root.fromName + ' (Admin)';

      const unreadIds = new Set(myUnread().map((m) => m.id));
